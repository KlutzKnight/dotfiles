[audio]
colorize_icons = true

[backdrop]
enabled = true

[bar]
order = [ "Top" ]

    [bar.Top]
    background_opacity = 0.8
    capsule = true
    center = [ "group:media", "clock" ]
    concave_edge_corners = false
    end = [ "group:utilities", "group:wireless", "group:power" ]
    margin_ends = 150
    start = [ "workspaces", "group:system-hub" ]
    widget_spacing = 8

        [[bar.Top.capsule_group]]
        id = "media"
        members = [ "media", "audio_visualizer" ]

        [[bar.Top.capsule_group]]
        id = "utilities"
        members = [ "tray", "notifications", "clipboard" ]

        [[bar.Top.capsule_group]]
        id = "wireless"
        members = [ "bluetooth", "network" ]

        [[bar.Top.capsule_group]]
        id = "power"
        members = [ "battery", "session" ]

        [[bar.Top.capsule_group]]
        id = "system-hub"
        members = [ "cpu", "ram" ]

[control_center]

    [control_center.media]
    show_visualizer = false

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "wallpaper"

    [[control_center.shortcuts]]
    type = "power_profile"

[keybinds]
down = [ "Ctrl+n" ]
up = [ "Ctrl+p" ]

[location]
auto_locate = true

[shell]
avatar_path = "/home/rafi/Pictures/Profile Pictures/Lamb.jpg"
font_family = "Ubuntu"
polkit_agent = true
show_location = false

    [shell.animation]
    speed = 1.25

    [shell.launcher]
    categories = false
    layout = "simple"

    [shell.panel]
    clipboard_placement = "attached"

[theme]
source = "wallpaper"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "qt" ]

[wallpaper]
directory = "/home/rafi/Pictures/Wallpapers"

[weather]
enabled = false

[widget.audio_visualizer]

    [widget.media]
    hide_when_no_media = true

    [widget.audio_visualizer.actions]
    back = "media previous"
    forward = "media next"
    left = "panel-toggle control-center media"
    right = "media toggle"
    scroll_down = "media previous"
    scroll_up = "media next"

[widget.clock]
format = "{:%A %d %b}  {:%H:%M}"
