"$schema" = 'https://starship.rs/config-schema.json'

format = """
${custom.prompt_top}\
[](#9A348E)\
$os\
$username\
[](bg:#DA627D fg:#9A348E)\
$directory\
[](fg:#DA627D bg:#FCA17D)\
$git_branch\
$git_status\
[](fg:#FCA17D bg:#86BBD8)\
$c\
$cpp\
$cmake\
$golang\
$gradle\
$java\
$maven\
$rust\
[](fg:#86BBD8 bg:#06969A)\
$docker_context\
[ ](fg:#06969A)\
$new_line
${custom.prompt_middle}\
$new_line
${custom.prompt_bottom}\
$character\
"""

# Disable the blank line at the start of the prompt
add_newline = true

# Custom Modules
[custom.prompt_top]
command = "printf '┌─'"
when = true  # Always
format = "[$output](bold purple)"

[custom.prompt_middle]
command = "printf '│'"
when = true  # Always
format = "[$output](bold purple)"

[custom.prompt_bottom]
command = "printf '╰──'"
when = true  # Always
format = "[$output](bold purple)"

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#9A348E"
style_root = "bg:#9A348E"
format = '[$user ]($style)'

[os]
style = "bg:#9A348E"
disabled = false # Disabled by default

[os.symbols]
Arch = "󰣇 "

[directory]
style = "bg:#DA627D"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"~" = " "
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Videos" = " "
"Desktop" = " "
"Projects" = " "
"Project" = " "
"Library" = "󰂺 "
".config" = " "
".local" = "󰉋 "
".cache" = "󰪺 "
".ssh" = "󰣀 "
".git" = "󰊢 "
"tmp" = "󰪺 "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'
detect_extensions = ['c']

[cpp]
disabled = false
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'
detect_extensions = ["cpp", "cc", "cxx"]

[cmake]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#06969A"
format = '[ $symbol $context ]($style)'

[git_branch]
symbol = ""
style = "bg:#FCA17D"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#FCA17D"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

